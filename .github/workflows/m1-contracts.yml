name: M1 contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - run: python -m pip install uv==0.9.11
      - run: uv sync --locked
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: node apps/showcase/build.mjs
      - run: node apps/showcase/build.mjs --check
      # Trust anchor for V1 guard; protect this workflow via owner review/required checks.
      - name: Check release guard before execution
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const sha = b => createHash('sha256').update(b).digest('hex');
          const raw = readFileSync('docs/release/V1_RELEASE_TRUST.json');
          assert.equal(sha(raw), 'c7f129581342c63887ec0d90c5e62bf3daa17f79468d63cbc0ba4f387901c1f0', 'CI release trust metadata mismatch');
          const trust = JSON.parse(raw);
          for (const [p, expected] of Object.entries({...trust.currentSourceHashes,...trust.bootstrapSourceHashes})) assert.equal(sha(Buffer.from(readFileSync(p,'utf8').replaceAll('\r\n','\n'))), expected, 'CI checker integrity mismatch');
          JS
      - run: node scripts/check_m45_release_package.mjs
      - run: node apps/showcase/test.mjs
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen flip-schemas --out docs/schema/1.0.0 --check
      - run: uv run --frozen python -m flip_core.import_schema_export --out docs/schema/m2/1.0.0 --check
      - run: uv run --frozen python -m flip_core.verification_schema_export --out docs/schema/m3/1.0.0 --check
      - run: uv run --frozen python -m flip_core.library_schema_export --out docs/schema/m45-library/1.0.0 --check
      - run: uv run --frozen python -m flip_core.library_schema_export --version 1.1.0 --out docs/schema/m45-library/1.1.0 --check
      - run: uv run --frozen python -m flip_core.debugging_schema_export --out docs/schema/m45-debugging/1.0.0 --check
      - run: uv run --frozen python -m flip_core.agent_schema_export --out docs/schema/m45-agent-workflow/1.0.0 --check
      - run: uv run --frozen python fixtures/m45-library-discovery/generators/verify_fixtures.py
      - run: uv run --frozen pytest -q --junitxml="${{ runner.temp }}/m3-tests.xml" -o junit_family=legacy
      - run: uv run --frozen python scripts/report_m3_acceptance.py --junit "${{ runner.temp }}/m3-tests.xml" --out "${{ runner.temp }}/m3-acceptance.json"
      - run: uv run --frozen python scripts/report_m4_acceptance.py --junit "${{ runner.temp }}/m3-tests.xml" --browser .test-tmp/m4-browser.json --out "${{ runner.temp }}/m4-acceptance.json"
      - run: uv run --frozen python scripts/check_m45_agent_acceptance.py
      - run: uv run --frozen python scripts/check_m45_agent_portable_review.py
      - run: uv run --frozen python -m flip_core.portable_schema_export --out docs/schema/m45-portable-project/1.1.0 --check
      - run: uv run --frozen python scripts/check_m45_portability.py
      - run: node docs/schema/m45-portable-project/check-canonical.mjs
      - run: uv run --frozen python -m flip_core.agent_portable_schema_export --out docs/schema/m45-agent-portable/1.0.0 --check
      - run: node docs/schema/m45-agent-portable/check-canonical.mjs
      - run: node docs/schema/check-canonical.mjs
      - run: uv run --frozen python scripts/check_m1_repository.py --require-clean
      - run: uv run --frozen python scripts/smoke_m1.py
      - run: uv run --frozen python scripts/smoke_m3.py
      - run: uv run --frozen python scripts/benchmark_m3.py --out "${{ runner.temp }}/m3-benchmark.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m3-benchmark-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/m3-benchmark.json
            ${{ runner.temp }}/m3-acceptance.json
            ${{ runner.temp }}/m3-tests.xml
            ${{ runner.temp }}/m4-acceptance.json
            .test-tmp/agent-independent/**/*.json
            .test-tmp/final-adapter-review/*.json
            .test-tmp/final-adapter-review/execution.log
            .test-tmp/r3/showcase-results.json
