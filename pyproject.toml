[project]
name = "flip-workspace"
version = "0.1.0"
requires-python = "==3.14.6"
dependencies = ["flip-core==0.1.0", "flip-cli==0.1.0", "flip-api==0.1.0"]

[dependency-groups]
dev = ["pytest==9.0.1", "jsonschema==4.25.1", "httpx==0.28.1", "ruff==0.14.5", "setuptools==80.9.0"]

[tool.uv]
package = false
required-version = "==0.9.11"
constraint-dependencies = ["anyio==4.11.0"]

[tool.uv.workspace]
members = ["packages/flip-core", "packages/flip-cli", "packages/flip-api"]

[tool.uv.sources]
flip-core = { workspace = true }
flip-cli = { workspace = true }
flip-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/flip-core/tests", "packages/flip-cli/tests", "packages/flip-api/tests"]
addopts = "-ra --basetemp=packages/flip-core/.test-tmp"

[tool.ruff]
target-version = "py314"
line-length = 100
# Immutable M1-B archival tool: exercise in scratch space without reformatting evidence.
extend-exclude = [
    # Exact original independent portability research/review; checked by custody.
    "fixtures/m45-portable-project/generators/build_portability_fixtures.py",
    "fixtures/m45-portable-project/generators/run_portability_cases.py",
    "fixtures/m45-portable-project/generators/verify_portability.py",
    "fixtures/m45-portable-independent-review/harness/portable_acceptance.py",
    "fixtures/m45-portable-independent-review/harness/evidence_trust.py",
    "fixtures/m45-portable-independent-review/harness/portable_api.py",
    # Pinned independent agent review; exact raw blobs are checked by custody.
    "fixtures/m45-agent-workflow-independent-review/harness/authorization_checks.py",
    "fixtures/m45-agent-workflow-independent-review/harness/independent_acceptance.py",
    # Immutable independent workflow corpus; checked by exact blobs and manifest.
    "fixtures/m45-agent-workflow/generators/build_corpus.py",
    "fixtures/m45-agent-workflow/generators/run_cli_cases.py",
    "fixtures/m45-agent-workflow/generators/verify_corpus.py",
    # Frozen independent debugger review; exact blobs and manifest checked by custody.
    "fixtures/m45-debugging-independent-review/harness/debug_parity.py",
    "fixtures/m45-debugging-independent-review/harness/independent_debug_checks.py",
    "fixtures/m45-debugging-independent-review/harness/production_case_matrix.py",
    "fixtures/m45-debugging-independent-review/harness/trust_attacks.py",
    # Immutable debugging corpus; original bytes are pinned by the custody guard.
    "fixtures/m45-debugging/generators/build_corpus.py",
    "fixtures/m45-debugging/generators/debug_core.py",
    "fixtures/m45-debugging/generators/verify_corpus.py",
    # Immutable, separately reviewed harnesses; exact blobs/manifests checked by custody.
    "fixtures/m45-library-independent-review/harness/independent_cli_api_checks.py",
    "fixtures/m45-library-independent-review/harness/independent_core_checks.py",
    "docs/evidence/m45-library-final-review/harness/independent_cli_api_checks.py",
    "docs/evidence/m45-library-final-review/harness/independent_core_checks.py",
    # Immutable independent M45 research; hash-verified rather than reformatted.
    "fixtures/m45-library-discovery/generators/",
    "fixtures/m4-independent-review/generators/run_review_cases.py",
    "fixtures/m4-independent-review/generators/run_trust_probes.py",
    "docs/evidence/derived/recompute_checks.py",
    "docs/evidence/m2-adversarial/build_corpus.py",
    "docs/evidence/m2-adversarial/verify_corpus.py",
    "fixtures/m3-verification/generators/build_corpus.py",
    "fixtures/m3-verification/generators/m3_core.py",
    "fixtures/m3-verification/generators/verify_corpus.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
