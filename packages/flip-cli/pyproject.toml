[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flip-cli"
version = "0.1.0"
description = "Flip command-line contract scaffold"
requires-python = "==3.14.6"
dependencies = ["flip-core==0.1.0"]

[project.scripts]
flip = "flip_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
